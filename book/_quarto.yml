project:
  type: default
  render:
    - report.qmd

format:
  html:
    toc: true
    toc-location: body
    toc-depth: 3
    number-sections: true
    embed-resources: true
    theme: cosmo
    code-fold: false
    code-tools: false
    notebook-links: false
  typst:
    toc: true
    toc-depth: 3
    number-sections: true
