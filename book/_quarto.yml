project:
  type: book
  output-dir: _book

book:
  title: "DCD Analysis Pipeline"
  author: "Research Pipeline"
  date: last-modified
  chapters:
    - index.qmd
    - 00_process-data.ipynb
    - 01_explore-data.ipynb
    - 02_analyze-data.ipynb
    - 03_model.ipynb
    - 04_analyze-model.ipynb

execute:
  freeze: auto
  enabled: false

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    theme: cosmo
    code-fold: false
    code-tools: false
    notebook-links: false
  typst:
    toc: true
    toc-depth: 3
    number-sections: true
    papersize: a4
    mainfont: "New Computer Modern"
    monofont: "Source Code Pro"
